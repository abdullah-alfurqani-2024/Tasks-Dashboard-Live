<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام مهام الدعم الفني والصيانة</title>
  <meta name="description" content="نظام إلكتروني لمتابعة مهام قسم الدعم الفني والصيانة">
  <meta name="theme-color" content="#1f5fa8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f5fa8'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- الخط الموحّد: Droid Arabic Kufi، وبديله المطابق Noto Kufi Arabic محفوظ داخل الموقع (fonts/) -->
  <link rel="preload" href="fonts/noto-kufi-arabic-arabic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/earlyaccess/droidarabickufi.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <script>
    // الوضع الليلي قبل الرسم لتجنب الوميض
    try {
      var t = localStorage.getItem('tsk.theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <a class="skip" href="#main">تخطَّ إلى المحتوى</a>
  <header class="topbar" id="topbar" hidden></header>
  <div class="demo-banner" id="demo-banner" hidden></div>
  <div class="as-banner" id="as-banner" role="status" hidden></div>
  <main id="main" class="main" tabindex="-1">
    <div class="boot"><div class="spinner" aria-hidden="true"></div><p>جارٍ التحميل…</p></div>
  </main>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">هذا النظام يحتاج تفعيل JavaScript في المتصفح.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
